name: CI Pipeline - MLOps

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout do código
      uses: actions/checkout@v5

    - name: Configurar Python 3.14
      id: setup-python
      uses: actions/setup-python@v6
      with:
        python-version: "3.14"

    - name: Instalar Poetry
      uses: snok/install-poetry@v1
      with:
        version: 1.8.2
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Cache das dependências do Poetry
      id: cached-poetry-dependencies
      uses: actions/cache@v5
      with:
        path: .venv
        key: venv-v2-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

    - name: Instalar dependências e pacote do projeto
      run: poetry install --no-interaction

    - name: Executar Suíte de Testes (Tox)
      run: poetry run tox -e py314