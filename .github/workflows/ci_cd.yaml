name: CI/CD Pipeline - MLOps

on:
  push:
    branches: [ "main" ]
    # Removemos a pasta tests/ do ignore para garantir que mudanças nos testes disparem o CI
    paths-ignore:
      - 'README.md'
      - 'notebooks/**'
      - 'lista_ordenada_de_comandos_bash.txt'
      - 'helm/**'
      - '*.png'
      - '*.jpg'
      - '*.csv'
      - '*.log'
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================
  # 1. CI: Testes e Validação
  # ==========================================
  test:
    name: Executar Testes (CI)
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar Python 3.14
        id: setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Instalar Poetry
        uses: snok/install-poetry@v1
        with:
          version: 2.4.3
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache das dependências do Poetry
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-v2-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Instalar dependências e pacote do projeto
        run: poetry install --no-interaction

      - name: Executar Suíte de Testes (Tox)
        run: poetry run tox -e py314

  # ==========================================
  # 2. CD: Build e Push Docker (Requer o CI)
  # ==========================================
  build-and-push-image:
    name: Build and Push to GHCR (CD)
    needs: test  # <--- A regra de ouro: só constrói se o CI brilhar verde!
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # Garante que o Docker só seja criado em um "push" direto na main, não em Pull Requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 1. Checkout do Repositório
        uses: actions/checkout@v5

      - name: 2. Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 3. Login no GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Extrair Metadados (Tags e Labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: 5. Build e Push da Imagem Docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max