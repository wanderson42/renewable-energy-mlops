name: MLflow runtime image

on:
  push:
    branches: [main, "infra/**"]
    paths: ["docker/mlflow/**", "scripts/test-mlflow-runtime.sh", ".github/workflows/mlflow-image.yaml"]
  pull_request:
    branches: [main]
    paths: ["docker/mlflow/**", "scripts/test-mlflow-runtime.sh", ".github/workflows/mlflow-image.yaml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
      - name: Set commit-specific MLflow tag in the existing package
        run: echo "MLFLOW_RUNTIME_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:mlflow-${GITHUB_SHA}" >> "$GITHUB_ENV"
      - name: Build and load the image for testing
        uses: docker/build-push-action@v6
        with:
          context: docker/mlflow
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.MLFLOW_RUNTIME_IMAGE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=mlflow-runtime
          cache-to: type=gha,mode=max,scope=mlflow-runtime
      - name: Check imports, dependencies and a temporary HTTP server without network
        run: bash scripts/test-mlflow-runtime.sh "$MLFLOW_RUNTIME_IMAGE"
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image and record its registry digest
        if: github.event_name != 'pull_request'
        run: |
          docker push "$MLFLOW_RUNTIME_IMAGE"
          docker image inspect "$MLFLOW_RUNTIME_IMAGE" --format '{{json .RepoDigests}}' > mlflow-image-digests.json
          {
            echo '### MLflow runtime image'
            echo "Tested and published: \`$MLFLOW_RUNTIME_IMAGE\`"
            echo '```json'
            cat mlflow-image-digests.json
            echo '```'
            echo 'No Kubernetes deployment was performed.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the published digest as an artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-image-digests
          path: mlflow-image-digests.json
          if-no-files-found: error
