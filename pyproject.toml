[tool.poetry]
name = "energy-mlops"
version = "0.1.0"
description = ""
authors = ["Wanderson <wlferreira@alumni.usp.br>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.14, <3.15"
requests = ">=2.34.2,<3.0.0"
pandas = ">=3.0.5,<4.0.0"
pydantic-settings = ">=2.15.0,<3.0.0"
pandera = ">=0.33.1,<0.34.0"
openmeteo-requests = ">=1.7.5,<2.0.0"
requests-cache = ">=1.3.3,<2.0.0"
retry-requests = ">=2.0.0,<3.0.0"
numpy = ">=2.5.3,<3.0.0"
pyarrow = ">=25.0.1,<26.0.0"
prefect = ">=3.8.6,<4.0.0"
matplotlib = ">=3.11.2,<4.0.0"
seaborn = ">=0.13.2,<0.14.0"
scipy = ">=1.18.1,<2.0.0"
statsmodels = ">=0.15.0,<0.16.0"
s3fs = ">=2026.9.0,<2027.0.0"
mlflow = ">=3.16.1,<4.0.0"
scikit-learn = ">=1.9.1,<2.0.0"
boto3 = "<1.43.76"
lightgbm = ">=4.7.0,<5.0.0"
optuna = ">=5.0.0,<6.0.0"
xgboost = ">=3.4.1,<4.0.0"
shap = ">=0.52.0,<0.53.0"
plotly = ">=5.10.0,<6.0.0"
streamlit = ">=1.64.0,<2.0.0"
psycopg2-binary = ">=2.9.13,<3.0.0"
loguru = "^0.7.3"
evidently = "^0.7.23"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.1.1,<10.0.0"
ruff = ">=0.16.8,<0.17.0"
ipykernel = ">=7.3.0,<8.0.0"
pytest-mock = ">=3.15.1,<4.0.0"
tox = ">=4.64.2,<5.0.0"
httpx2 = ">=2.13.1,<3.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::PendingDeprecationWarning:shap.*",
    "ignore::DeprecationWarning:shap.*"
]
