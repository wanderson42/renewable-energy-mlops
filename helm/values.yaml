  # Observado no servidor em 05/10/2026; separado do poetry.lock da aplicação.
  runtimePackages:
    - mlflow==3.16.1
    - boto3==1.43.96
    - botocore==1.43.96
    - psycopg2-binary==2.9.13
    - s3transfer==0.19.2
    - jmespath==1.1.0
    - urllib3==2.8.0
    - python-dateutil==2.9.0.post0
    - six==1.17.0

api:
  enabled: true
  image:
    repository: ghcr.io/wanderson42/renewable-energy-mlops
