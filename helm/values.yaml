    repository: rustfs/rustfs
    tag: latest
    digest: ""
    pullPolicy: Always
  rootUser: ""
  rootPassword: ""
  apiPort: 9000
  consolePort: 9001

postgres:
  image:
    repository: postgres
    tag: "13"
    digest: ""
    pullPolicy: IfNotPresent
  user: ""
  password: ""
  db: ""

mlflow:
  image:
    repository: ghcr.io/mlflow/mlflow
    tag: v3.16.1-full
    digest: ""
